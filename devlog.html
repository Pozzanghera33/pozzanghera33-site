<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog | POZZANGHERA 33</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* 前回のCSSをそのまま使用 */
        :root { --puddle-blue: #00a8ff; --boot-black: #1a1c20; --accent-red: #ff7675; }
        body { margin: 0; font-family: 'Fredoka', sans-serif; display: flex; height: 100vh; background: #f4f7f6; }
        .sidebar { width: 300px; background: var(--boot-black); color: white; display: flex; flex-direction: column; border-right: 4px solid var(--puddle-blue); }
        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid #333; }
        .sidebar-header a { color: white; text-decoration: none; font-weight: 600; opacity: 0.7; }
        .sidebar-header a:hover { opacity: 1; }
        .log-list { overflow-y: auto; flex: 1; }
        .log-item { padding: 20px; border-bottom: 1px solid #333; cursor: pointer; transition: 0.3s; }
        .log-item:hover { background: #2c3e50; }
        .log-item.active { background: var(--puddle-blue); color: white; }
        .log-item .date { font-size: 0.8rem; opacity: 0.6; display: block; }
        .log-item .title { font-size: 1rem; font-weight: 600; margin-top: 5px; }
        .content-area { flex: 1; overflow-y: auto; padding: 40px; background: white; }
        #logContent { max-width: 900px; margin: 0 auto; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="index.html">← Back to Home</a>
            <h2 style="color: var(--puddle-blue);">DevLog</h2>
        </div>
        <div class="log-list" id="logList">

            <div class="log-item" onclick="loadLog('v031', this)">
                <span class="date">May 4, 2026</span>
                <span class="title">v0.3.0: Character Fitting Room</span>
            </div>
            
            <div class="log-item" onclick="loadLog('v030', this)">
                <span class="date">May 4, 2026</span>
                <span class="title">v0.3.0: Character Fitting Room</span>
            </div>

            <div class="log-item" onclick="loadLog('ea-launch', this)">
                <span class="date">January 1, 2026</span>
                <span class="title">🚀 Early Access is LIVE!</span>
            </div>

        </div>
    </aside>

    <main class="content-area" id="contentArea">
        <div id="logContent">
            </div>
    </main>

    <script>
        async function loadLog(fileName, element) {
            const contentArea = document.getElementById('logContent');
            try {
                // ファイルを読み込み
                const response = await fetch(`logs/${fileName}.html`);
                if (!response.ok) throw new Error('File not found');
                const html = await response.text();
                
                // コンテンツを入れ替え
                contentArea.innerHTML = html;

                // アクティブな項目の色を変える
                document.querySelectorAll('.log-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');

                // スクロールを一番上へ
                document.getElementById('contentArea').scrollTop = 0;
            } catch (error) {
                contentArea.innerHTML = `<p style="color:red; padding:20px;">Error: Could not load the log file.</p>`;
            }
        }

        // ページを開いたときに自動で一番上の記事を表示する
        window.onload = () => {
            const firstItem = document.querySelector('.log-item');
            if (firstItem) loadLog('v030', firstItem); // ここに最新のファイル名を書く
        };
    </script>
</body>
</html>
